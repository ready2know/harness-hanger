name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `harness-hanger ...`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Desktop app
        - CLI
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: harness-hanger version
      description: Output of `harness-hanger --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11, ...
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      placeholder: Claude Code 2.x
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove secrets, tokens, and private paths before pasting.
      render: shell
